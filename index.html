<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Subtitle Downloader</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#0b5ed7;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.9;
}

main{
  max-width:700px;
  margin:20px auto;
  padding:0 12px;
}

.panel{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,select,button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

input{
  margin-bottom:12px;
}

select{
  margin-bottom:12px;
}

button{
  border:0;
  background:#0b5ed7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button.secondary{
  background:#198754;
}

button.gray{
  background:#6c757d;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
  margin:0;
}

.search-row button{
  width:120px;
}

#status{
  margin-top:12px;
  font-size:14px;
  color:#555;
}

.series-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.episode{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 5px;
  border-bottom:1px solid #eee;
}

.episode:last-child{
  border-bottom:0;
}

.episode input{
  width:auto;
  margin:0;
}

.episode-name{
  flex:1;
}

.download-btn{
  width:auto;
  padding:8px 12px;
  font-size:14px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
}

.hidden{
  display:none;
}

.note{
  font-size:13px;
  color:#666;
  line-height:1.5;
}

@media(max-width:500px){
  .search-row button{
    width:95px;
  }

  .episode{
    font-size:14px;
  }

  .download-btn{
    padding:7px 9px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📺 TV Subtitle Downloader</h1>
  <p>Find Sinhala subtitles for TV series</p>
</header>

<main>

  <section class="panel">

    <label for="seriesSearch">TV Series</label>

    <div class="search-row">
      <input
        id="seriesSearch"
        type="text"
        placeholder="Enter series name..."
      >

      <button onclick="searchSeries()">
        🔎 Search
      </button>
      <button onclick="getArrowFromBaiscope()">
  📺 Read Arrow Episodes
</button>
      <button onclick="testEpisodePage()">
  🧪 Test Episode Page
</button>

      <button onclick="testReplitAPI()">🔌 Test Replit API</button>
    </div>
    

    <div id="status"></div>

  </section>


  <section id="seriesPanel" class="panel hidden">

    <div class="series-title" id="seriesName">
      Series Name
    </div>

    <label for="seasonSelect">Season</label>

    <select id="seasonSelect" onchange="loadEpisodes()">
      <option value="">Select Season</option>
    </select>

  </section>


  <section id="episodesPanel" class="panel hidden">

    <label>Episodes</label>

    <div class="actions">
      <button class="gray" onclick="selectAll()">
        ☑️ Select All
      </button>

      <button class="gray" onclick="unselectAll()">
        ⬜ Clear
      </button>
    </div>

    <div id="episodeList"></div>

    <div class="actions">
      <button class="secondary" onclick="downloadSelected()">
        📦 Download Selected
      </button>
    </div>

  </section>


  <section class="panel">

    <div class="note">
      <b>How it will work:</b><br><br>

      1. Search for a TV series.<br>
      2. Select the season.<br>
      3. Select the episodes you need.<br>
      4. Press <b>Download Selected</b>.<br>
      5. The subtitles will be collected into one ZIP file.
    </div>

  </section>

</main>


<script>
  async function testEpisodePage(){

const status = document.getElementById("status");

status.textContent = "🔄 Checking Baiscope page through Replit...";

const apiUrl =
"https://subtitle-link-finder-api--d88114074.replit.app/api/subtitle-links/extract";

const pageUrl =
"https://www.baiscope.lk/download/breaking-bad-s01-e04-sinhala-subtitle/4343";

try {

const response = await fetch(apiUrl, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    url: pageUrl
  })
});

const result = await response.json();

if(!response.ok){
  throw new Error("API error: " + response.status);
}

status.textContent =
  "✅ Replit checked the page. Links found: " +
  (result.links ? result.links.length : 0);

console.log("Subtitle page result:", result);

} catch(error) {

console.error("Subtitle API error:", error);

status.textContent =
  "❌ API request failed: " + error.message;

}

}
  async function testReplitAPI() {
const apiUrl =
"https://subtitle-link-finder-api--d88114074.replit.app/api/subtitle-links/extract";
    const pageUrl =
"https://www.baiscope.lk/download/breaking-bad-s01-e04-sinhala-subtitle/4343";

const status = document.getElementById("status");

status.textContent = "Connecting to Replit API...";

try {
const response = await fetch(apiUrl, {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
url: pageUrl
})
});

const result = await response.json();

if (!response.ok) {
  throw new Error("API error: " + response.status);
}

status.textContent =
  "API connected successfully! Found " +
  (result.links ? result.links.length : 0) +
  " link(s).";

console.log("Replit API result:", result);

} catch (error) {
status.textContent =
"Connection failed: " + error.message;

console.error("Replit API error:", error);

}
}

let currentSeries = "";
  
  async function getArrowFromBaiscope(){

const status = document.getElementById("status");
const list = document.getElementById("episodeList");
const panel = document.getElementById("episodesPanel");
const seasonSelect = document.getElementById("seasonSelect");
    seasonSelect.removeAttribute("onchange");
const seriesName = document.getElementById("seriesName");

status.textContent = "🔄 Loading Arrow episodes from Replit API...";
list.innerHTML = "";
seasonSelect.innerHTML = '<option value="">Select Season</option>';

const apiUrl =
"https://subtitle-link-finder-api--d88114074.replit.app/api/series/episodes";

try {

const response = await fetch(apiUrl, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    url: "https://www.baiscope.lk/tv-series/arrow/"
  })
});

const result = await response.json();

if(!response.ok){
  throw new Error(
    result.error || "API request failed: HTTP " + response.status
  );
}

if(!Array.isArray(result.episodes)){
  throw new Error("The API response does not contain an episodes list.");
}

const seasons = {};

result.episodes.forEach(item => {

  const match = item.text.match(
    /S\s*(\d+)\s*[:\-]\s*E\s*(\d+)(?:\s*[–-]\s*E?\s*(\d+))?/i
  );

  if(!match || !item.url) return;

  const season = Number(match[1]);
  const firstEpisode = Number(match[2]);
  const lastEpisode = match[3]
    ? Number(match[3])
    : firstEpisode;

  if(!seasons[season]){
    seasons[season] = [];
  }

  for(let episode = firstEpisode; episode <= lastEpisode; episode++){

    const alreadyExists = seasons[season].some(
      entry => entry.episode === episode
    );

    if(!alreadyExists){
      seasons[season].push({
        season,
        episode,
        text: item.text,
        url: item.url
      });
    }

  }

});

const seasonNumbers = Object.keys(seasons)
  .map(Number)
  .sort((a,b) => a-b);

if(seasonNumbers.length === 0){
  throw new Error("No season and episode numbers were recognized.");
}

if(seriesName){
  seriesName.textContent = "Arrow";
}

seasonNumbers.forEach(season => {

  const option = document.createElement("option");
  option.value = season;
  option.textContent = "Season " + season;
  seasonSelect.appendChild(option);

});

seasonSelect.onchange = function(){

  list.innerHTML = "";

  const selectedSeason = Number(this.value);

  if(!selectedSeason || !seasons[selectedSeason]){
    return;
  }

  seasons[selectedSeason]
    .sort((a,b) => a.episode-b.episode)
    .forEach(item => {

      const row = document.createElement("div");
      row.className = "episode";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "episodeCheck";
      checkbox.value = item.url;
      checkbox.dataset.title = item.text;

      const name = document.createElement("div");
      name.className = "episode-name";
      name.textContent =
        "S" + String(item.season).padStart(2,"0") +
        " E" + String(item.episode).padStart(2,"0");

      const linkButton = document.createElement("button");
      linkButton.className = "download-btn";
      linkButton.textContent = "🔗";
      linkButton.type = "button";
      linkButton.addEventListener("click", function(){
        window.open(item.url, "_blank", "noopener");
      });

      row.appendChild(checkbox);
      row.appendChild(name);
      row.appendChild(linkButton);
      list.appendChild(row);

    });

};

panel.classList.remove("hidden");

seasonSelect.value = seasonNumbers[0];
seasonSelect.dispatchEvent(new Event("change"));

status.textContent =
  "✅ Loaded " + result.episodes.length +
  " Arrow episode-page links across " +
  seasonNumbers.length + " seasons. Select a season to view episodes.";

} catch(error) {

console.error("Arrow episode loading error:", error);

status.textContent =
  "❌ Could not load Arrow episodes: " + error.message;

}

}

const seriesData = {

  "arrow": {

    name: "Arrow",

    seasons: {
      1: 23,
      2: 23,
      3: 23,
      4: 23,
      5: 23,
      6: 23,
      7: 22,
      8: 10
    }

  }

};


// Search series
function searchSeries(){

  const name =
    document.getElementById("seriesSearch")
      .value
      .trim();

  const status =
    document.getElementById("status");

  if(!name){

    status.textContent =
      "Please enter a TV series name.";

    return;
  }


  const key =
    name.toLowerCase();


  const series =
    seriesData[key];


  if(!series){

    status.textContent =
      "Series not available in the test database.";

    document
      .getElementById("seriesPanel")
      .classList.add("hidden");

    document
      .getElementById("episodesPanel")
      .classList.add("hidden");

    return;
  }


  currentSeries =
    series.name;


  document.getElementById("seriesName")
    .textContent =
      series.name;


  document.getElementById("seriesPanel")
    .classList.remove("hidden");


  status.textContent =
    "Series found. Select a season.";


  const select =
    document.getElementById("seasonSelect");


  select.innerHTML =
    '<option value="">Select Season</option>';


  for(const season in series.seasons){

    const option =
      document.createElement("option");


    option.value =
      season;


    option.textContent =
      "Season " +
      season +
      " (" +
      series.seasons[season] +
      " episodes)";


    select.appendChild(option);

  }


  document
    .getElementById("episodesPanel")
    .classList.add("hidden");

}


// Load episodes
function loadEpisodes(){

  const season =
    document.getElementById("seasonSelect")
      .value;


  const panel =
    document.getElementById("episodesPanel");


  const list =
    document.getElementById("episodeList");


  if(!season){

    panel.classList.add("hidden");

    return;
  }


  const series =
    seriesData[
      currentSeries.toLowerCase()
    ];


  if(!series){

    return;
  }


  const episodeCount =
    series.seasons[season];


  list.innerHTML = "";


  for(let i=1; i<=episodeCount; i++){

    const row =
      document.createElement("div");


    row.className =
      "episode";


    row.innerHTML = `

      <input
        type="checkbox"
        class="episodeCheck"
        value="${i}"
      >

      <div class="episode-name">
        S${String(season).padStart(2,"0")}
        E${String(i).padStart(2,"0")}
      </div>

      <button
        class="download-btn"
        onclick="downloadEpisode(${i})"
      >
        ⬇️
      </button>

    `;


    list.appendChild(row);

  }


  panel.classList.remove("hidden");

}


// Select all
function selectAll(){

  document
    .querySelectorAll(".episodeCheck")
    .forEach(box => {

      box.checked = true;

    });

}


// Clear selection
function unselectAll(){

  document
    .querySelectorAll(".episodeCheck")
    .forEach(box => {

      box.checked = false;

    });

}


// Individual download
function downloadEpisode(number){

  const season =
    document.getElementById("seasonSelect")
      .value;


  alert(
    "Baiscope download will be connected next.\n\n" +
    currentSeries +
    " S" +
    String(season).padStart(2,"0") +
    "E" +
    String(number).padStart(2,"0")
  );

}


// Bulk download
// Find subtitle links for selected episodes
async function downloadSelected(){

  const selected = Array.from(
    document.querySelectorAll(".episodeCheck:checked")
  );

  const status = document.getElementById("status");

  if(selected.length === 0){
    alert("Please select at least one episode.");
    return;
  }

  const apiUrl =
    "https://subtitle-link-finder-api--d88114074.replit.app/api/subtitle-links/extract";

  status.textContent =
    "🔄 Finding subtitle links for " +
    selected.length + " selected episodes...";

  // Create or reuse the results area
  let results = document.getElementById("subtitleResults");

  if(!results){
    results = document.createElement("div");
    results.id = "subtitleResults";
    results.style.padding = "12px";
    results.style.marginTop = "12px";
    results.style.overflowWrap = "anywhere";

    const panel = document.getElementById("episodesPanel");
    panel.appendChild(results);
  }

  results.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = "Subtitle Links";
  results.appendChild(heading);

  let found = 0;
  let failed = 0;

  for(let i = 0; i < selected.length; i++){

    const checkbox = selected[i];
    const pageUrl = checkbox.value;
    const title = checkbox.dataset.title ||
      ("Episode " + (i + 1));

    const episodeHeading = document.createElement("p");
    episodeHeading.textContent =
      "🔎 " + title;
    results.appendChild(episodeHeading);

    try{

      const response = await fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          url: pageUrl
        })
      });

      const result = await response.json();

      if(!response.ok){
        throw new Error(
          result.error || "HTTP " + response.status
        );
      }

      if(!Array.isArray(result.links) ||
         result.links.length === 0){

        const message = document.createElement("p");
        message.textContent = "No subtitle links found.";
        results.appendChild(message);
        continue;
      }

      result.links.forEach(item => {

        const url = typeof item === "string"
          ? item
          : item.url || item.href || item.link;

        if(!url){
          return;
        }

        const link = document.createElement("a");
        link.href = url;
        link.textContent = "⬇️ Open subtitle link";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.style.display = "block";
        link.style.margin = "8px 0";

        results.appendChild(link);
        found++;

      });

    }catch(error){

      failed++;

      const message = document.createElement("p");
      message.textContent =
        "❌ Could not check this page: " + error.message;

      results.appendChild(message);
    }
  }

  status.textContent =
    "✅ Search finished. Links found: " + found +
    ". Pages with errors: " + failed + ".";

}
</script>

</body>
</html>
