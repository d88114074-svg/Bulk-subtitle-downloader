<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Subtitle Downloader</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#0b5ed7;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.9;
}

main{
  max-width:700px;
  margin:20px auto;
  padding:0 12px;
}

.panel{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,select,button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

input{
  margin-bottom:12px;
}

select{
  margin-bottom:12px;
}

button{
  border:0;
  background:#0b5ed7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button.secondary{
  background:#198754;
}

button.gray{
  background:#6c757d;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
  margin:0;
}

.search-row button{
  width:120px;
}

#status{
  margin-top:12px;
  font-size:14px;
  color:#555;
}

.series-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.episode{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 5px;
  border-bottom:1px solid #eee;
}

.episode:last-child{
  border-bottom:0;
}

.episode input{
  width:auto;
  margin:0;
}

.episode-name{
  flex:1;
}

.download-btn{
  width:auto;
  padding:8px 12px;
  font-size:14px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
}

.hidden{
  display:none;
}

.note{
  font-size:13px;
  color:#666;
  line-height:1.5;
}

@media(max-width:500px){
  .search-row button{
    width:95px;
  }

  .episode{
    font-size:14px;
  }

  .download-btn{
    padding:7px 9px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📺 TV Subtitle Downloader</h1>
  <p>Find Sinhala subtitles for TV series</p>
</header>

<main>

  <section class="panel">

    <label for="seriesSearch">TV Series</label>

    <div class="search-row">
      <input
        id="seriesSearch"
        type="text"
        placeholder="Enter series name..."
      >

      <button onclick="searchSeries()">
        🔎 Search
      </button>
      <button onclick="getArrowFromBaiscope()">
  📺 Read Arrow Episodes
</button>
      <button onclick="testEpisodePage()">
  🧪 Test Episode Page
</button>

      <button onclick="testReplitAPI()">🔌 Test Replit API</button>
    </div>
    

    <div id="status"></div>

  </section>


  <section id="seriesPanel" class="panel hidden">

    <div class="series-title" id="seriesName">
      Series Name
    </div>

    <label for="seasonSelect">Season</label>

    <select id="seasonSelect" onchange="loadEpisodes()">
      <option value="">Select Season</option>
    </select>

  </section>


  <section id="episodesPanel" class="panel hidden">

    <label>Episodes</label>

    <div class="actions">
      <button class="gray" onclick="selectAll()">
        ☑️ Select All
      </button>

      <button class="gray" onclick="unselectAll()">
        ⬜ Clear
      </button>
    </div>

    <div id="episodeList"></div>

    <div class="actions">
      <button class="secondary" onclick="downloadSelected()">
        📦 Download Selected
      </button>
    </div>

  </section>


  <section class="panel">

    <div class="note">
      <b>How it will work:</b><br><br>

      1. Search for a TV series.<br>
      2. Select the season.<br>
      3. Select the episodes you need.<br>
      4. Press <b>Download Selected</b>.<br>
      5. The subtitles will be collected into one ZIP file.
    </div>

  </section>

</main>


<script>
  async function testEpisodePage(){

const status = document.getElementById("status");

status.textContent = "🔄 Checking Baiscope page through Replit...";

const apiUrl =
"https://subtitle-link-finder-api--d88114074.replit.app/api/subtitle-links/extract";

const pageUrl =
"https://www.baiscope.lk/arrow-s02-e01-sinhala-subtitles/";

try {

const response = await fetch(apiUrl, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    url: pageUrl
  })
});

const result = await response.json();

if(!response.ok){
  throw new Error("API error: " + response.status);
}

status.textContent =
  "✅ Replit checked the page. Links found: " +
  (result.links ? result.links.length : 0);

console.log("Subtitle page result:", result);

} catch(error) {

console.error("Subtitle API error:", error);

status.textContent =
  "❌ API request failed: " + error.message;

}

}
  async function testReplitAPI() {
const apiUrl =
"https://subtitle-link-finder-api--d88114074.replit.app/api/subtitle-links/extract";
    const pageUrl =
"https://www.baiscope.lk/download/breaking-bad-s01-e04-sinhala-subtitle/4343";

const status = document.getElementById("status");

status.textContent = "Connecting to Replit API...";

try {
const response = await fetch(apiUrl, {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
url: pageUrl
})
});

const result = await response.json();

if (!response.ok) {
  throw new Error("API error: " + response.status);
}

status.textContent =
  "API connected successfully! Found " +
  (result.links ? result.links.length : 0) +
  " link(s).";

console.log("Replit API result:", result);

} catch (error) {
status.textContent =
"Connection failed: " + error.message;

console.error("Replit API error:", error);

}
}

let currentSeries = "";
  
  async function getArrowFromBaiscope(){

  const status = document.getElementById("status");
  const list = document.getElementById("episodeList");
  const panel = document.getElementById("episodesPanel");

  status.textContent = "Reading Arrow episodes from Baiscope...";

  try {

    const response = await fetch(
      "https://www.baiscope.lk/tv-series/arrow/"
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const html = await response.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const links = [...doc.querySelectorAll("a")];

    const episodes = links.filter(link => {

      const href = link.getAttribute("href") || "";
      const text = link.textContent.trim();

      return (
        /arrow.*s\d+.*e\d+/i.test(href) ||
        /arrow.*s\d+.*e\d+/i.test(text)
      );

    });

    list.innerHTML = "";

const seasons = {};

episodes.forEach(link => {

  const href = new URL(
  link.getAttribute("href"),
  "https://www.baiscope.lk/"
).href;

  const match =
  (link.textContent + " " + href).match(
    /s(\d+)\s*[:\-]\s*e(\d+)(?:\s*[-–&]\s*e(\d+))?/i
  );

  if(!match) return;

const season = Number(match[1]);
const firstEpisode = Number(match[2]);

const lastEpisode = match[3]
  ? Number(match[3])
  : firstEpisode;

for(let episode = firstEpisode; episode <= lastEpisode; episode++){

  if(!seasons[season]){
    seasons[season] = [];
  }

  seasons[season].push({
    season: season,
    episode: episode,
    url: href
  });

}

});

Object.keys(seasons)
  .sort((a,b) => Number(a) - Number(b))
  .forEach(season => {

    const heading = document.createElement("h3");

    heading.textContent =
      "📺 Season " + season;

    list.appendChild(heading);

    seasons[season]
      .sort((a,b) => a.episode - b.episode)
      .forEach(item => {

        const row = document.createElement("div");

        row.className = "episode";

        row.innerHTML = `
          <input
            type="checkbox"
            class="episodeCheck"
            value="${item.url}"
          >

          <div class="episode-name">
            S${String(item.season).padStart(2,"0")}
            E${String(item.episode).padStart(2,"0")}
          </div>

          <button
            class="download-btn"
            onclick="window.open('${item.url}','_blank')"
          >
            🔗
          </button>
        `;

        list.appendChild(row);

      });

  });

    panel.classList.remove("hidden");

    status.textContent =
      "✅ Found " + episodes.length +
      " Arrow episode links.";

  } catch(error) {

    console.error(error);

    status.textContent =
      "❌ Could not read Arrow episodes.";

  }

}

const seriesData = {

  "arrow": {

    name: "Arrow",

    seasons: {
      1: 23,
      2: 23,
      3: 23,
      4: 23,
      5: 23,
      6: 23,
      7: 22,
      8: 10
    }

  }

};


// Search series
function searchSeries(){

  const name =
    document.getElementById("seriesSearch")
      .value
      .trim();

  const status =
    document.getElementById("status");

  if(!name){

    status.textContent =
      "Please enter a TV series name.";

    return;
  }


  const key =
    name.toLowerCase();


  const series =
    seriesData[key];


  if(!series){

    status.textContent =
      "Series not available in the test database.";

    document
      .getElementById("seriesPanel")
      .classList.add("hidden");

    document
      .getElementById("episodesPanel")
      .classList.add("hidden");

    return;
  }


  currentSeries =
    series.name;


  document.getElementById("seriesName")
    .textContent =
      series.name;


  document.getElementById("seriesPanel")
    .classList.remove("hidden");


  status.textContent =
    "Series found. Select a season.";


  const select =
    document.getElementById("seasonSelect");


  select.innerHTML =
    '<option value="">Select Season</option>';


  for(const season in series.seasons){

    const option =
      document.createElement("option");


    option.value =
      season;


    option.textContent =
      "Season " +
      season +
      " (" +
      series.seasons[season] +
      " episodes)";


    select.appendChild(option);

  }


  document
    .getElementById("episodesPanel")
    .classList.add("hidden");

}


// Load episodes
function loadEpisodes(){

  const season =
    document.getElementById("seasonSelect")
      .value;


  const panel =
    document.getElementById("episodesPanel");


  const list =
    document.getElementById("episodeList");


  if(!season){

    panel.classList.add("hidden");

    return;
  }


  const series =
    seriesData[
      currentSeries.toLowerCase()
    ];


  if(!series){

    return;
  }


  const episodeCount =
    series.seasons[season];


  list.innerHTML = "";


  for(let i=1; i<=episodeCount; i++){

    const row =
      document.createElement("div");


    row.className =
      "episode";


    row.innerHTML = `

      <input
        type="checkbox"
        class="episodeCheck"
        value="${i}"
      >

      <div class="episode-name">
        S${String(season).padStart(2,"0")}
        E${String(i).padStart(2,"0")}
      </div>

      <button
        class="download-btn"
        onclick="downloadEpisode(${i})"
      >
        ⬇️
      </button>

    `;


    list.appendChild(row);

  }


  panel.classList.remove("hidden");

}


// Select all
function selectAll(){

  document
    .querySelectorAll(".episodeCheck")
    .forEach(box => {

      box.checked = true;

    });

}


// Clear selection
function unselectAll(){

  document
    .querySelectorAll(".episodeCheck")
    .forEach(box => {

      box.checked = false;

    });

}


// Individual download
function downloadEpisode(number){

  const season =
    document.getElementById("seasonSelect")
      .value;


  alert(
    "Baiscope download will be connected next.\n\n" +
    currentSeries +
    " S" +
    String(season).padStart(2,"0") +
    "E" +
    String(number).padStart(2,"0")
  );

}


// Bulk download
function downloadSelected(){

  const selected =
    document.querySelectorAll(
      ".episodeCheck:checked"
    );


  if(selected.length === 0){

    alert(
      "Please select at least one episode."
    );

    return;
  }


  alert(
    selected.length +
    " episodes selected.\n\n" +
    "Bulk ZIP download will be connected next."
  );

}

</script>

</body>
</html>
